spring:
  application:
    name: assignment

  datasource:
    url: jdbc:mysql://localhost:3306/assignment?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

    # Google OAuth 클라이언트 설정
    spring:
      security:
        oauth2:
          client:
            registration:
              google:
                client-id: ${GOOGLE_CLIENT_ID}
                client-secret: ${GOOGLE_CLIENT_SECRET}
                scope:
                  - profile
                  - email

# JWT 설정
security:
  jwt:
    secret: seopsopt-fighting
    access-token-expires-in-seconds: 1800     # 30분
    refresh-token-expires-in-seconds: 1209600 # 2주